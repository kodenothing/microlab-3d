name: Capture website screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-screenshots.yml']

permissions:
  contents: write

concurrency:
  group: showcase-screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install browser
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual deployed application
        env:
          CAPTURE_DIR: ${{ github.workspace }}/screenshots
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$CAPTURE_DIR"
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({args: ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try {
              const page = await browser.newPage({viewport:{width:1600,height:1000},deviceScaleFactor:1});
              const response = await page.goto('https://microlab-3d.vercel.app/',{waitUntil:'domcontentloaded',timeout:60000});
              if (!response || !response.ok()) throw new Error('Website response: '+response?.status());
              await page.getByRole('button',{name:'MicroLab 3D',exact:true}).waitFor({timeout:60000});
              const nav = page.getByRole('navigation',{name:'Microcontroller platforms'});
              async function capture(name, needsCanvas) {
                if (needsCanvas) await page.locator('canvas').first().waitFor({state:'visible',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                await page.waitForTimeout(3000);
                await page.screenshot({path:path.join(process.env.CAPTURE_DIR,name+'.png'),animations:'disabled'});
                console.log('Captured '+name);
              }
              await capture('guided-lesson',true);
              await nav.getByRole('button',{name:'Components',exact:true}).click();
              await page.waitForTimeout(1500);
              await capture('component-explorer',false);
              await nav.getByRole('button',{name:'Build',exact:true}).click();
              await capture('circuit-builder',true);
            } finally { await browser.close(); }
          })().catch(error => {console.error(error); process.exit(1);});
          NODE
      - name: Update README with verified screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          marker = '<!-- showcase-screenshots -->'
          end = '<!-- /showcase-screenshots -->'
          block = """<!-- showcase-screenshots -->
          ## Screenshots

          Actual screenshots of the hosted MicroLab 3D application.

          **Guided lessons**

          ![MicroLab 3D guided lesson workspace](screenshots/guided-lesson.png)

          **3D circuit builder**

          ![MicroLab 3D circuit builder](screenshots/circuit-builder.png)

          **Component explorer**

          ![MicroLab 3D component explorer](screenshots/component-explorer.png)

          <!-- /showcase-screenshots -->
          """
          if marker in text:
              start = text.index(marker)
              finish = text.index(end, start) + len(end)
              text = text[:start] + block.rstrip() + text[finish:]
          else:
              text = text.replace('## Explore the workbench', block + '\n## Explore the workbench', 1)
          p.write_text(text)
          PY
      - name: Publish screenshots and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: publish live MicroLab 3D screenshots"
          gh auth setup-git
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
